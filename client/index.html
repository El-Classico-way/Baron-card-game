<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1a4a2e" />
  <meta name="description" content="Multiplayer card game — play Bang! in your browser" />

  <title>Bang! Online</title>

  <!-- Preconnect to server for faster WS handshake -->
  <link rel="preconnect" href="/" />

  <link rel="stylesheet" href="/css/main.css" />
</head>
<body>

  <!-- ================================================================
       CONNECTION BANNER
       Shown when the WebSocket is disconnected or reconnecting.
       Hidden when connected.
       ================================================================ -->
  <div id="connection-banner" class="connection-banner" hidden>
    Connection lost — reconnecting…
  </div>

  <!-- ================================================================
       NOTIFICATION AREA
       Transient toasts appended by renderer.renderNotification().
       Lives outside panels so it's always on top.
       ================================================================ -->
  <div id="notification-area" aria-live="polite" aria-atomic="false"></div>

  <!-- ================================================================
       JOIN PANEL
       Shown on first load when no reconnect_token is in sessionStorage.
       ================================================================ -->
  <div id="join-panel">
    <div class="join-card">
      <h1 class="join-card__title">Bang!</h1>
      <p class="join-card__subtitle">A multiplayer card game</p>

      <form id="join-form" novalidate>
        <div class="form-group">
          <label for="display-name-input">Your name</label>
          <input
            id="display-name-input"
            type="text"
            placeholder="Wild Bill"
            maxlength="32"
            autocomplete="nickname"
            required
          />
        </div>

        <div class="form-group">
          <label for="room-id-input">
            Room code
            <span style="font-weight:normal; color:#888">(leave blank to create)</span>
          </label>
          <input
            id="room-id-input"
            type="text"
            placeholder="abc123"
            maxlength="16"
            autocomplete="off"
            spellcheck="false"
          />
        </div>

        <button id="join-btn" class="btn" type="submit" style="width:100%">
          Enter Saloon
        </button>
      </form>
    </div>
  </div>

  <!-- ================================================================
       LOBBY PANEL
       Shown after joining, before the game starts.
       ================================================================ -->
  <div id="lobby-panel" hidden>
    <h2 class="lobby-title">Waiting Room</h2>

    <div class="lobby-room-id">
      Room: <span id="room-id-display">—</span>
    </div>

    <ul id="lobby-player-list" class="lobby-player-list"></ul>

    <button id="start-game-btn" class="btn" hidden disabled>
      Start Game
    </button>

    <p style="font-size:0.8rem; color:rgba(255,255,255,0.5); text-align:center; margin-top: 8px;">
      Share the room code with friends to let them join.
    </p>
  </div>

  <!-- ================================================================
       GAME PANEL
       The main table.  Hidden until game starts.
       ================================================================ -->
  <div id="game-panel" hidden>

    <!-- HUD bar across the top -->
    <div class="hud" style="grid-area:hud">
      <div id="turn-indicator" class="turn-indicator">Waiting…</div>

      <div class="hud__deck">
        <span title="Cards in draw pile">🂠 <span id="deck-count">—</span></span>
        <span title="Cards in discard pile">🗑 <span id="discard-count">—</span></span>
      </div>
    </div>

    <!-- Opponents ring -->
    <div id="opponents-area" aria-label="Other players"></div>

    <!-- Local player row -->
    <div id="my-player-area">
      <!-- Stats sidebar -->
      <div class="my-stats">
        <div class="my-stats__name">You</div>
        <div class="my-hp-bar-wrap">
          <div id="my-hp-bar" role="progressbar" aria-label="Your HP">
            <div id="my-hp-bar-fill"></div>
          </div>
          <span id="my-hp-display">—</span>
        </div>
        <!-- Role card, shown once assigned -->
        <div id="role-panel" hidden></div>
      </div>

      <!-- Hand cards -->
      <div id="hand-area" aria-label="Your hand"></div>

      <!-- Deck + discard stack (visible on desktop, collapsed on mobile) -->
      <div class="deck-area" aria-label="Deck">
        <div class="deck-pile card--face-down">
          <div class="card__back"></div>
        </div>
        <div id="discard-top" class="discard-pile--empty" aria-label="Discard pile top"></div>
      </div>
    </div>

    <!-- Action bar -->
    <div id="action-bar" class="action-bar--inactive">
      <button class="btn" data-action="draw"
              aria-label="Draw 2 cards" hidden>
        Draw
      </button>

      <button class="btn" data-action="end-turn"
              aria-label="End your turn" hidden>
        End Turn
      </button>

      <!--
        Discard phase: the player clicks cards in hand directly.
        No dedicated button needed — hand-card clicks emit ui:card_clicked
        which controller routes to discard when phase === "discard".
      -->

      <button class="btn" data-action="request-sync"
              title="Re-sync game state from server"
              style="background:transparent; border:1px solid rgba(255,255,255,0.2); font-size:0.7rem; padding:4px 8px">
        ↻ Sync
      </button>
    </div>

    <!-- Sidebar: chat + (on desktop) deck area -->
    <aside class="sidebar">
      <!-- Deck and discard at top of sidebar on desktop -->
      <div class="deck-area" style="flex-direction:row; justify-content:center; gap:8px; padding:8px">
        <div class="deck-pile" style="min-width:var(--card-w); height:var(--card-h)">
          <div class="card__back" style="border-radius: var(--card-radius);"></div>
        </div>
        <div id="discard-top-sidebar" aria-label="Top of discard pile"></div>
      </div>

      <!-- Chat -->
      <div class="chat-panel">
        <div id="chat-messages" aria-live="polite" aria-label="Chat messages"></div>

        <form id="chat-form" aria-label="Send chat message">
          <input
            id="chat-input"
            type="text"
            placeholder="Say something…"
            maxlength="256"
            autocomplete="off"
          />
        </form>
      </div>
    </aside>

  </div><!-- /#game-panel -->

  <!-- ================================================================
       OVERLAYS
       Rendered into by renderer.renderGameOver() and renderReactionWindow().
       Both hidden by default; renderer sets hidden=false when needed.
       ================================================================ -->

  <!-- Game over / results -->
  <div id="game-overlay" hidden aria-modal="true" role="dialog" aria-label="Game over"></div>

  <!-- Missed! reaction window -->
  <div id="reaction-overlay" hidden aria-modal="true" role="dialog" aria-label="React to incoming attack"></div>

  <!-- ================================================================
       APP ENTRY POINT
       type="module" enables ES module imports.
       defer is implied by modules but stated for clarity.
       ================================================================ -->
  <script type="module" src="/js/app.js"></script>

</body>
</html>
